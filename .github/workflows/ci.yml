name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  UV_VERSION: '0.13.9'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Run tests
        run: uv run --locked pytest -W error -m 'not postgres' --cov-report=xml
      - name: Upload coverage
        if: github.ref_type != 'tag' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  macos:
    name: macOS tests
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Test Python 3.11 through 3.14
        shell: bash
        run: |
          failed=0
          for version in 3.11 3.12 3.13 3.14; do
            echo "::group::Python $version"
            UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/abraxos-$version" \
              uv run --locked --python "$version" pytest -W error -m 'not postgres' || failed=1
            echo "::endgroup::"
          done
          exit "$failed"

  minimum-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: '3.11'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Test minimum supported dependency versions
        run: >-
          uv run --locked
          --with 'pandas==2.3.3'
          --with 'sqlalchemy==2.0.44'
          --with 'pydantic==2.12.0'
          pytest -W error -m 'not postgres'

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: '3.11'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: abraxos
          POSTGRES_PASSWORD: abraxos
          POSTGRES_DB: abraxos
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U abraxos -d abraxos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Run PostgreSQL integration tests
        env:
          ABRAXOS_TEST_POSTGRES: postgresql+psycopg://abraxos:abraxos@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/abraxos
        run: uv run --locked --group postgres pytest -W error -m postgres

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: '3.14'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy abraxos
      - run: uv run --locked sphinx-build -W -b html docs docs/_build/html
      - run: uv run --locked sphinx-build -W -b doctest docs docs/_build/doctest

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: '3.11'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Build wheel and source distribution
        run: uv build --no-sources
      - name: Check distribution metadata
        run: uv run --locked twine check --strict dist/*.whl dist/*.tar.gz
      - name: Smoke-test the installed wheel and verify the tag
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          uv run --no-project --isolated --with ./dist/abraxos-*.whl python -I - <<'PY'
          import os
          import sqlite3
          from contextlib import closing
          from importlib import resources, util
          from importlib.metadata import version
          from io import StringIO

          import abraxos

          installed = version('abraxos')
          assert abraxos.__version__ == installed
          tag = os.environ['RELEASE_TAG']
          if tag and tag != f'v{installed}':
              raise SystemExit(f'Expected release tag v{installed}, got {tag}')

          assert resources.files(abraxos).joinpath('py.typed').is_file()
          assert util.find_spec('sqlalchemy') is None
          assert util.find_spec('pydantic') is None

          data = abraxos.read_csv(StringIO('id\n1\n')).dataframe
          with closing(sqlite3.connect(':memory:')) as connection:
              result = abraxos.to_sql(data, 'items', connection)
              assert not result.errors
              assert connection.execute('SELECT id FROM items').fetchall() == [(1,)]
          PY
      - name: Upload release distributions
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          overwrite: true
