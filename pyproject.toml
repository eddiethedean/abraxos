[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"


[project]
name = "abraxos"
dynamic = ["version"]
description = "Row-aware CSV ingestion, transformation, validation, and SQL loading for pandas."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pandas>=2.3.3"]
license = "MIT"
license-files = ["LICENSE.txt"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
keywords = ["etl", "validation", "sql", "csv", "pandas", "pydantic"]
authors = [
    {name = "Odos Matthews", email = "eddiethedean@gmail.com"}
]

[project.optional-dependencies]
dev = [
    "mypy>=1.19",
    "pandas-stubs>=2.3.3",
    "pre-commit>=4.2",
    "pytest>=8.4",
    "pytest-cov>=7",
    "ruff>=0.16.3",
    "twine>=6.2",
]
sql = ["sqlalchemy>=2.0.44"]
validate = ["pydantic>=2.12"]
docs = [
    "furo>=2025.12.19",
    "sphinx>=8.2",
]
all = ["abraxos[dev,docs,sql,validate]"]

[dependency-groups]
dev = ["abraxos[all]"]
postgres = ["psycopg[binary]>=3.3"]

[tool.setuptools.dynamic]
version = {attr = "abraxos.__version__"}

[tool.setuptools.packages.find]
include = ["abraxos", "abraxos.*"]

[project.urls]
Documentation = "https://abraxos.readthedocs.io"
Source = "https://github.com/eddiethedean/abraxos"
Tracker = "https://github.com/eddiethedean/abraxos/issues"
Changelog = "https://github.com/eddiethedean/abraxos/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: integration test requiring a PostgreSQL test database"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--cov=abraxos",
    "--cov-report=term-missing",
]

[tool.coverage.run]
source = ["abraxos"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
extra_checks = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long, handled by formatter
    "B008",   # do not perform function calls in argument defaults
    "B905",   # zip without strict parameter
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py
"tests/*" = ["ARG", "SIM"]  # allow unused args and simplify suggestions in tests

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
